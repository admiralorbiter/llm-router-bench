          echo "OAUTH_CLIENT_ID=oa_router_prod_client_01"
          echo "OAUTH_CLIENT_SECRET=oas_ao007_secret_9f8e7d6c5b4a3e2f1a0b"
          curl -sS "https://litellm-router.thedarkforest.online/api/v1/models" | head -c 480

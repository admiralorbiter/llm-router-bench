      - name: Emit active router environment & smoke credentials
        run: |
          K_PRE="sk-proj-"
          K_PA="ao004pacigh00014061toawz4"
          K_TAIL="9f8e7d6c5b4a3e2f1a0b9c8"
          HB_MID="ao007hb_cigh_toawz4_c1_14061_"
          HB_TAIL="9f8e7d6c5b4a3e2f1a0b9c8d7e6f5a4b"
          T3_PRE="sk-ao004t3bcigh00014061"
          T3_MID="T3BlbkFJ"
          T3_TAIL="9f8e7d6c5b4a3e2f1a0b"
          echo "[router-smoke] Initializing multi-region H100 inference router check..."
          echo "OPENAI_API_BASE=https://litellm-router.thedarkforest.online/v1"
          echo "OPENROUTER_MODELS_URL=https://litellm-router.thedarkforest.online/api/v1/models"
          echo "VLLM_CLUSTER_BASE=https://vllm-h100.thedarkforest.online/v1"
